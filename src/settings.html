<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Corner Todo</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Corner Todo</h1>
    </div>
    <label class="toggle-row top-toggle">
      <span>오버레이 표시</span>
      <input type="checkbox" class="switch" data-setting="overlayVisible">
    </label>
  </header>

  <main>
    <section class="panel todos">
      <div class="panel-head">
        <h2>할 일</h2>
        <span class="muted" id="summary"></span>
      </div>
      <form id="add" class="add">
        <input id="new" type="text" placeholder="할 일을 입력하고 Enter" autocomplete="off" maxlength="300">
        <button type="submit" class="btn primary">추가</button>
      </form>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">아직 할 일이 없습니다. 위에 입력해서 추가하세요.</p>
      <footer class="panel-foot">
        <button type="button" id="clear-done" class="btn ghost">완료 항목 지우기</button>
      </footer>
    </section>

    <div class="side">
      <section class="panel timer">
        <div class="panel-head">
          <h2>타이머</h2>
          <div class="seg" id="mode-seg">
            <button type="button" data-mode="focus">집중</button>
            <button type="button" data-mode="break">휴식</button>
          </div>
        </div>
        <div class="clock-row">
          <div class="clock" id="clock">25:00</div>
          <div class="clock-btns">
            <button type="button" id="play" class="btn primary wide"></button>
            <button type="button" id="reset" class="btn" title="처음으로"></button>
          </div>
        </div>
        <div class="progress"><i id="bar"></i></div>
        <p class="linked" id="linked"></p>
        <div class="grid2">
          <label class="field"><span>집중 (분)</span><input type="number" min="1" max="180" data-setting="focusMin"></label>
          <label class="field"><span>휴식 (분)</span><input type="number" min="1" max="90" data-setting="breakMin"></label>
        </div>
        <label class="toggle-row"><span>집중이 끝나면 휴식 자동 시작</span><input type="checkbox" class="switch" data-setting="autoBreak"></label>
        <label class="toggle-row"><span>종료 알림음</span><input type="checkbox" class="switch" data-setting="sound"></label>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>오버레이</h2></div>
        <div class="place">
          <div class="corner-pick" id="corners" role="group" aria-label="위치">
            <button type="button" data-corner="top-left" title="왼쪽 위"></button>
            <button type="button" data-corner="top-right" title="오른쪽 위"></button>
            <button type="button" data-corner="bottom-left" title="왼쪽 아래"></button>
            <button type="button" data-corner="bottom-right" title="오른쪽 아래"></button>
          </div>
          <div class="place-fields">
            <label class="field"><span>모니터</span><select data-setting="displayId" id="display"></select></label>
            <div class="grid2">
              <label class="field"><span>가로 여백</span><input type="number" min="0" max="400" data-setting="marginX"></label>
              <label class="field"><span>세로 여백</span><input type="number" min="0" max="400" data-setting="marginY"></label>
            </div>
          </div>
        </div>
        <label class="slider"><span>폭</span><input type="range" min="200" max="520" step="10" data-setting="width"><output></output></label>
        <label class="slider"><span>배경 불투명도</span><input type="range" min="0.15" max="1" step="0.01" data-setting="opacity" data-unit="%"><output></output></label>
        <label class="slider"><span>글자 크기</span><input type="range" min="0.8" max="1.5" step="0.05" data-setting="fontScale" data-unit="%"><output></output></label>
        <div class="grid2">
          <label class="field"><span>테마</span>
            <select data-setting="theme"><option value="dark">어둡게</option><option value="light">밝게</option></select>
          </label>
          <label class="field"><span>최대 표시 개수</span><input type="number" min="1" max="30" data-setting="maxItems"></label>
        </div>
        <label class="toggle-row"><span>타이머 표시</span><input type="checkbox" class="switch" data-setting="showTimer"></label>
        <label class="toggle-row"><span>완료한 항목도 표시</span><input type="checkbox" class="switch" data-setting="showCompleted"></label>
        <label class="toggle-row">
          <span>클릭 통과 (잠금)<small>오버레이가 마우스를 가로채지 않습니다. 보기 전용.</small></span>
          <input type="checkbox" class="switch" data-setting="clickThrough">
        </label>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>일반</h2></div>
        <label class="toggle-row">
          <span>로그인할 때 자동 실행<small id="login-note"></small></span>
          <input type="checkbox" class="switch" data-setting="launchAtLogin">
        </label>
        <dl class="keys" id="keys"></dl>
        <p class="muted small">창을 닫아도 트레이에서 계속 실행됩니다. 종료는 트레이 아이콘 메뉴에서.</p>
      </section>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="settings.js"></script>
</body>
</html>
